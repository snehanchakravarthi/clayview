[project]
name = "clayview"
version = "0.1.0"
description = "Tesla-style clay 3D view of surrounding traffic, from a recorded dashcam clip."
readme = "README.md"
keywords = ["dashcam", "computer-vision", "yolo", "object-tracking", "3d-visualization", "threejs"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "lap>=0.5.12",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "scipy>=1.18.1",
    "timm>=1.0.30",
    "transformers>=5.22.1",
    "ultralytics>=8.3.0",
]

[project.urls]
Repository = "https://github.com/snehanchakravarthi/clayview"

[project.scripts]
clayview = "clayview.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clayview"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
